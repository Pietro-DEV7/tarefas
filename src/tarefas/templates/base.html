
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ titulo_da_pagina }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Digite a tarefa e a data de conclusão (opcional):</h1>

    <form method="POST">

        <input
            type="text"
            id="tituloTarefa"
            name="tituloTarefa"
            placeholder="Digite sua tarefa"
            required
        >

        <input
            type="date"
            id="dataConclusao"
            name="dataConclusao"
        >

        <button type="submit">Adicionar</button>

    </form>

    <ul id="listaTarefas">

        {% for tarefa in tarefas_da_pagina %}

            <li>

                <span>
                    {{ tarefa.titulo_tarefa }} - {{ tarefa.data_conclusao }}
                </span>

                <form
                    action="{{ url_for('apagar', id_tarefa=tarefa.id_tarefa) }}"
                    method="POST"
                    class="form-apagar"
                >
                    <button type="submit">Apagar</button>
                </form>

            </li>

        {% endfor %}

    </ul>

</body>
</html>
